name: CI

on:
  push:
    branches: [dev, stag, prod]
  pull_request:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_dev_pass
          POSTGRES_DB: gym_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e . --group dev

      - name: Prepare test roles
        working-directory: backend
        run: python3 ../scripts/prepare_test_roles.py

      - name: Ruff check
        working-directory: backend
        run: .venv/bin/ruff check app/ tests/

      - name: Run tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Typecheck + build
        run: npm run build
