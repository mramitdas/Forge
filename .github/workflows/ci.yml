name: CI

on:
  push:
    branches: [dev, stag, prod]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_dev_pass
          POSTGRES_DB: gym_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e . --group dev

      - name: Prepare test roles
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              "postgresql://gym:gym_dev_pass@localhost:5432/gym_erp_test"
          )
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(
              "CREATE ROLE gym_admin LOGIN SUPERUSER PASSWORD 'gym_admin_pass'"
          )
          cur.execute("ALTER ROLE gym NOSUPERUSER NOBYPASSRLS")
          conn.close()
          print("test roles ready")
          PY

      - name: Ruff check
        working-directory: backend
        run: .venv/bin/ruff check app/ tests/ scripts/

      - name: Type check (mypy)
        working-directory: backend
        run: .venv/bin/mypy app

      - name: Tests + coverage
        working-directory: backend
        env:
          COVERAGE_CORE: sysmon
        run: |
          .venv/bin/python -m pytest -q \
            --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck + build
        run: npm run build

  e2e:
    name: E2E (platform)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_dev_pass
          POSTGRES_DB: gym_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GYM_DATABASE_URL: postgresql+asyncpg://gym:gym_dev_pass@localhost:5432/gym_erp
      GYM_ENVIRONMENT: test
      GYM_JWT_HMAC_SECRET: ci-only-hmac-secret-not-for-production
      GYM_PLATFORM_ADMIN_EMAIL: ci-admin@example.com
      GYM_PLATFORM_ADMIN_PASSWORD: Ci-Admin-123!
      GYM_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e . --group dev

      - name: Migrate + seed
        working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m scripts.seed_dev
          .venv/bin/python -m scripts.seed_fixtures

      - name: Start backend
        working-directory: backend
        run: |
          nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/live && break || sleep 1
          done

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install + build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Start frontend
        working-directory: apps/web
        run: |
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/login > /dev/null && break || sleep 1
          done

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run platform suite
        working-directory: apps/web
        run: npx playwright test e2e/platform --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: cat /tmp/backend.log /tmp/frontend.log || true
