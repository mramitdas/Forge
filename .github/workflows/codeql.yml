name: CodeQL

on:
  push:
    branches: [dev, stag, prod]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze
    # Push runs on dev/stag/prod already analyze the promotion branches. The
    # pull_request pass cannot upload SARIF when the head ref is a protected
    # branch (stag/prod), so promotion PRs skip it and rely on the push run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref != 'stag' && github.head_ref != 'prod')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
